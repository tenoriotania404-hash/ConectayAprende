{% extends 'base.html' %}

{% block contenido %}

<div class="contenedor">

    <div class="card">

        <h2>Iniciar Sesión</h2>

        <form method="POST">

            <input type="email"
                   name="correo"
                   placeholder="Correo electrónico"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Contraseña"
                   required>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p>
            ¿No tienes cuenta?
            <a href="{{ url_for('registro') }}">
                Crear cuenta
            </a>
        </p>

    </div>

</div>

{% endblock %}
