{% extends 'base.html' %}

{% block contenido %}

<div class="contenedor">

    <div class="card">

        <h2>Crear Cuenta</h2>

        <form method="POST">

            <input type="text"
                   name="nombre"
                   placeholder="Nombre completo"
                   required>

            <input type="email"
                   name="correo"
                   placeholder="Correo electrónico"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Contraseña"
                   required>

            <button type="submit">
                Registrarme
            </button>

        </form>

        <p>
            <a href="{{ url_for('login') }}">
                Ya tengo una cuenta
            </a>
        </p>

    </div>

</div>

{% endblock %}
